services:
  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: prod
    environment:
      # nginx.conf.template interpolates this into proxy_pass. Without it
      # a base-only `up` renders `http://server:/api/` and nginx refuses
      # to start on an invalid upstream port.
      - SERVER_PORT=${SERVER_PORT}
    depends_on:
      - server
    networks:
      - app-network

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: prod
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${SERVER_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      # The origin the browser sees. Every OAuth redirect_uri is built from it,
      # so it must match what is registered at the provider exactly.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - BOOTSTRAP_OWNER_EMAIL=${BOOTSTRAP_OWNER_EMAIL}
      # Optional, with defaults in config/env.ts. Listed because this file
      # whitelists what reaches the container: an unlisted variable in .env
      # simply never arrives.
      - SIGNUP_MODE=${SIGNUP_MODE}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES}
      - UPLOAD_QUOTA_BYTES=${UPLOAD_QUOTA_BYTES}
      - MAX_RECORDS_PER_USER=${MAX_RECORDS_PER_USER}
      - MAX_WISHLIST_PER_USER=${MAX_WISHLIST_PER_USER}
      - MAX_SETUP_PER_USER=${MAX_SETUP_PER_USER}
      - MAX_SIGNUPS_PER_HOUR=${MAX_SIGNUPS_PER_HOUR}
    volumes:
      - uploads:/app/server/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

volumes:
  db-data:
  uploads:

networks:
  app-network:
    driver: bridge
