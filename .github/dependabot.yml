version: 2

updates:
  # npm workspaces are covered from the root: one manifest tree, one lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Grouped so a quiet week is one pull request rather than eleven. Major
    # bumps stay separate, because those are the ones worth reading.
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  # Base images in both Dockerfiles and in the compose files: node, nginx,
  # postgres, caddy. These are the ones nobody remembers to update.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
