name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token is read/write across the repository. Nothing in this
# workflow writes anything, so nothing here gets to.
permissions:
  contents: read

env:
  DATABASE_URL_TEST: postgresql://vinyl_lib:vinyl_lib_dev_password@localhost:5432/vinyl_lib_test?schema=public

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vinyl_lib
          POSTGRES_PASSWORD: vinyl_lib_dev_password
          POSTGRES_DB: vinyl_lib_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Migrate test database
        run: npm run test:db:setup -w server

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Reports rather than blocks, for now. A brand-new scanner that fails main
    # on day one teaches everyone to bypass it. Remove this once the first
    # findings have been triaged — DEPLOYMENT.md tracks it as a follow-up.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Not optional. The default shallow checkout scans one commit and
          # reports clean, which is worse than not running the scan at all.
          fetch-depth: 0

      - name: Gitleaks
        # The container rather than the action: gitleaks-action wants a licence
        # key for organisations, and this needs neither an account nor a secret.
        # Pinned by digest for the same reason the deployment is.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --no-banner --redact --exit-code 1
