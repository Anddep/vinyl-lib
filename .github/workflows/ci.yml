name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL_TEST: postgresql://vinyl_lib:vinyl_lib_dev_password@localhost:5432/vinyl_lib_test?schema=public

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vinyl_lib
          POSTGRES_PASSWORD: vinyl_lib_dev_password
          POSTGRES_DB: vinyl_lib_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Migrate test database
        run: npm run test:db:setup -w server

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
