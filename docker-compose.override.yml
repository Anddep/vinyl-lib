services:
  client:
    build:
      target: dev
    command: ['npm', 'run', 'dev', '--', '--host', '0.0.0.0']
    environment:
      - CHOKIDAR_USEPOLLING=true
      - SERVER_PORT=${SERVER_PORT}
    ports:
      - '${CLIENT_PORT}:5173'
    volumes:
      - ./client:/app/client
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - /app/node_modules
      - /app/client/node_modules

  server:
    build:
      target: dev
    # The schema is bind-mounted but the generated client lives in the image's
    # node_modules, so editing schema.prisma leaves the container querying
    # columns that no longer exist. Regenerating on start makes the dev
    # container self-healing after a migration.
    command: ['sh', '-c', 'npx prisma generate && npm run dev']
    environment:
      - NODE_ENV=development
      - PORT=${SERVER_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      # Compose replaces the base list rather than merging it, so every variable
      # the server reads has to be repeated here as well.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - BOOTSTRAP_OWNER_EMAIL=${BOOTSTRAP_OWNER_EMAIL}
      - SIGNUP_MODE=${SIGNUP_MODE}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES}
      - UPLOAD_QUOTA_BYTES=${UPLOAD_QUOTA_BYTES}
      - MAX_RECORDS_PER_USER=${MAX_RECORDS_PER_USER}
      - MAX_WISHLIST_PER_USER=${MAX_WISHLIST_PER_USER}
      - MAX_SETUP_PER_USER=${MAX_SETUP_PER_USER}
      - MAX_SIGNUPS_PER_HOUR=${MAX_SIGNUPS_PER_HOUR}
    volumes:
      - ./server:/app/server
      # Listed after the bind mount so the named volume wins for this
      # subpath — otherwise ./server would shadow uploaded files.
      - uploads:/app/server/uploads
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - /app/node_modules
      - /app/server/node_modules
    ports:
      # Development only: the host runs the test suite and curl against
      # these directly. In production nginx is the sole public surface.
      - '${SERVER_PORT}:${SERVER_PORT}'

  db:
    ports:
      - '${POSTGRES_PORT}:5432'

volumes:
  uploads:
