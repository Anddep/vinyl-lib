services:
  client:
    build:
      target: dev
    command: ['npm', 'run', 'dev', '--', '--host', '0.0.0.0']
    environment:
      - CHOKIDAR_USEPOLLING=true
      - SERVER_PORT=${SERVER_PORT}
    ports:
      - '${CLIENT_PORT}:5173'
    volumes:
      - ./client:/app/client
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - /app/node_modules
      - /app/client/node_modules

  server:
    build:
      target: dev
    command: ['npm', 'run', 'dev']
    environment:
      - NODE_ENV=development
      - PORT=${SERVER_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
    volumes:
      - ./server:/app/server
      # Listed after the bind mount so the named volume wins for this
      # subpath — otherwise ./server would shadow uploaded files.
      - uploads:/app/server/uploads
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - /app/node_modules
      - /app/server/node_modules
    ports:
      # Development only: the host runs the test suite and curl against
      # these directly. In production nginx is the sole public surface.
      - '${SERVER_PORT}:${SERVER_PORT}'

  db:
    ports:
      - '${POSTGRES_PORT}:5432'

volumes:
  uploads:
